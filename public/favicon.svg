<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Obsidian Glass Base with subtle chromatic richness -->
    <linearGradient id="appTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a2e"/>
      <stop offset="40%" stop-color="#141322"/>
      <stop offset="70%" stop-color="#0d0d17"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>

    <!-- Blended Soft Rim Light (no harsh boundary, seamless transition) -->
    <linearGradient id="blendedRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3378" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Internal Radial Nebula Bloom (blends heart seamlessly into background) -->
    <radialGradient id="nebulaGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ff2e93" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#9333ea" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Heart Lobe: Passion Rose Gradient -->
    <linearGradient id="passionRose" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#ff1361"/>
      <stop offset="50%" stop-color="#ff2a8d"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Right Heart Lobe: Royal Orchid to Indigo Gradient -->
    <linearGradient id="royalViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Specular Highlight for Polished Glass Luster -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 3D Overlap Depth Shadow -->
    <filter id="ribbonOverlapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1.5" dy="2.5" stdDeviation="2" flood-color="#030308" flood-opacity="0.65"/>
    </filter>

    <!-- Tile Ambient Elevation Drop Shadow -->
    <filter id="tileAmbientShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base with Soft Elevation -->
  <g filter="url(#tileAmbientShadow)">
    <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#appTileBg)"/>
    <!-- Internal Ambient Nebula Bloom -->
    <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#nebulaGlow)"/>
    <!-- Blended Translucent Rim (Seamless Border Light) -->
    <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="none" stroke="url(#blendedRim)" stroke-width="1.2"/>
  </g>

  <!-- Left Foundation Lobe (Passionate Rose Ribbon) -->
  <path
    d="M 32 49.5
       C 21.5 41.5 11 32 11 21
       C 11 12 17.5 8 24.5 9.5
       C 28 10.5 30.8 13 32 17
       C 33 23 28.5 32 32 49.5 Z"
    fill="url(#passionRose)"
  />

  <!-- Right Overlapping Fold (Royal Violet Ribbon with 3D Depth) -->
  <path
    d="M 32 17
       C 33 13 36 9 43.5 10
       C 50.5 11 53 16 53 22
       C 53 32 42.5 41.5 32 49.5
       C 34.5 40 37.5 30 35.5 23
       C 34.5 20.5 33.2 18.5 32 17 Z"
    fill="url(#royalViolet)"
    filter="url(#ribbonOverlapShadow)"
  />

  <!-- Curved Specular Luster on Left Crown -->
  <path
    d="M 14.5 19.5
       C 14.5 13.5 18.5 10.5 24.5 11"
    fill="none"
    stroke="url(#specularGlint)"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Curved Specular Luster on Right Crown -->
  <path
    d="M 49.5 19.5
       C 49.5 14 45.5 11 41 11"
    fill="none"
    stroke="url(#specularGlint)"
    stroke-width="1.3"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- The "Dil Ki Baatein" Poetic Spark / Starlight Emblem -->
  <g transform="translate(32, 23)">
    <path
      d="M 0 -4.2
         Q 0 0 4.2 0
         Q 0 0 0 4.2
         Q 0 0 -4.2 0
         Q 0 0 0 -4.2 Z"
      fill="#ffffff"
      filter="drop-shadow(0 0 2px rgba(255,255,255,0.8))"
    />
    <circle cx="0" cy="0" r="1.2" fill="#ffd166"/>
  </g>
</svg>